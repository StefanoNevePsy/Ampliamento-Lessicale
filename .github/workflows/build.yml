name: Build Desktop & Android

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target da buildare'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - windows
          - android

jobs:
  # ==========================================
  # macOS Build (DMG) — Tahoe dark/tinted icon support
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate macOS icon with Tahoe light/dark/tinted variants
        run: |
          # Install sharp-cli for SVG→PNG conversion
          npm install --no-save sharp-cli

          # Generate 1024x1024 PNGs from each SVG variant
          npx sharp -i build/icon.svg -o build/icon_light_1024.png resize 1024 1024 2>/dev/null || \
            sips -z 1024 1024 build/icon.png --out build/icon_light_1024.png 2>/dev/null || \
            cp build/icon.png build/icon_light_1024.png

          npx sharp -i build/icon-dark.svg -o build/icon_dark_1024.png resize 1024 1024 2>/dev/null || true

          npx sharp -i build/icon-tinted.svg -o build/icon_tinted_1024.png resize 1024 1024 2>/dev/null || true

          # ---- Standard .iconset (light mode) ----
          mkdir -p build/icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size build/icon_light_1024.png --out build/icon.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            if [ $double -le 1024 ]; then
              sips -z $double $double build/icon_light_1024.png --out build/icon.iconset/icon_${size}x${size}@2x.png
            fi
          done

          # ---- macOS Tahoe dark mode variants ----
          # iconutil on macOS Sequoia+ supports _dark and _tinted suffixed PNGs in the iconset
          if [ -f build/icon_dark_1024.png ]; then
            for size in 16 32 64 128 256 512; do
              sips -z $size $size build/icon_dark_1024.png --out "build/icon.iconset/icon_${size}x${size}_dark.png"
              double=$((size * 2))
              if [ $double -le 1024 ]; then
                sips -z $double $double build/icon_dark_1024.png --out "build/icon.iconset/icon_${size}x${size}@2x_dark.png"
              fi
            done
          fi

          # ---- macOS Tahoe tinted mode variants ----
          if [ -f build/icon_tinted_1024.png ]; then
            for size in 16 32 64 128 256 512; do
              sips -z $size $size build/icon_tinted_1024.png --out "build/icon.iconset/icon_${size}x${size}_tinted.png"
              double=$((size * 2))
              if [ $double -le 1024 ]; then
                sips -z $double $double build/icon_tinted_1024.png --out "build/icon.iconset/icon_${size}x${size}@2x_tinted.png"
              fi
            done
          fi

          # Generate .icns file (includes dark/tinted variants on macOS 26+)
          iconutil -c icns build/icon.iconset -o build/icon.icns 2>/dev/null || true

          # Fallback: if iconutil fails (older macOS runner), generate standard .icns
          if [ ! -f build/icon.icns ]; then
            # Remove dark/tinted variants and retry
            rm -f build/icon.iconset/*_dark.png build/icon.iconset/*_tinted.png
            iconutil -c icns build/icon.iconset -o build/icon.icns 2>/dev/null || true
          fi

      - name: Build macOS DMG
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: StimolatoreClinico-macOS
          path: dist/*.dmg

  # ==========================================
  # Windows Build (EXE / NSIS Installer)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Windows icon from SVG
        shell: bash
        run: |
          npm install --no-save sharp-cli
          npx sharp -i build/icon.svg -o build/icon_256.png resize 256 256 2>/dev/null || true
          # electron-builder can use icon.png directly if .ico is not available
          if [ -f build/icon_256.png ]; then
            cp build/icon_256.png build/icon_win.png
          fi

      - name: Build Windows EXE
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StimolatoreClinico-Windows
          path: dist/*.exe

  # ==========================================
  # Android Build (APK via Capacitor) — Monet/Material You support
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Install image tools
        run: npm install --no-save sharp-cli

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp -r css www/
          cp -r js www/
          cp -r build www/

      - name: Initialize Capacitor Android
        run: npx cap add android

      - name: Generate Android adaptive icons with Monet/Material You support
        run: |
          # ---- Legacy icons (pre-API 26) ----
          for size_dpi in "48 mdpi" "72 hdpi" "96 xhdpi" "144 xxhdpi" "192 xxxhdpi"; do
            set -- $size_dpi
            npx sharp -i build/icon.svg -o android/app/src/main/res/mipmap-${2}/ic_launcher.png resize ${1} ${1}
            cp android/app/src/main/res/mipmap-${2}/ic_launcher.png android/app/src/main/res/mipmap-${2}/ic_launcher_round.png
          done

          # ---- Foreground layer for adaptive icon (108dp canvas, brain centered) ----
          for size_dpi in "108 mdpi" "162 hdpi" "216 xhdpi" "324 xxhdpi" "432 xxxhdpi"; do
            set -- $size_dpi
            mkdir -p android/app/src/main/res/drawable-${2}
            npx sharp -i build/icon-foreground.svg -o android/app/src/main/res/drawable-${2}/ic_launcher_foreground.png resize ${1} ${1}
          done

          # ---- Monochrome layer for Material You / Monet theming (API 33+) ----
          for size_dpi in "108 mdpi" "162 hdpi" "216 xhdpi" "324 xxhdpi" "432 xxxhdpi"; do
            set -- $size_dpi
            npx sharp -i build/icon-monochrome.svg -o android/app/src/main/res/drawable-${2}/ic_launcher_monochrome.png resize ${1} ${1}
          done

          # ---- Adaptive icon XML (API 26+) with monochrome (API 33+) ----
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@drawable/ic_launcher_foreground"/>
    <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
</adaptive-icon>
XMLEOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # ---- Background color resource (indigo to match brand) ----
          mkdir -p android/app/src/main/res/values
          if ! grep -q "ic_launcher_background" android/app/src/main/res/values/colors.xml 2>/dev/null; then
            cat > android/app/src/main/res/values/ic_launcher_background.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#4F46E5</color>
</resources>
XMLEOF
          fi

          # ---- Themed icon XML for Android 13+ (uses monochrome) ----
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_themed.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@drawable/ic_launcher_monochrome"/>
    <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
</adaptive-icon>
XMLEOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: StimolatoreClinico-Android
          path: android/app/build/outputs/apk/debug/*.apk

  # ==========================================
  # Create Release (on tag push)
  # ==========================================
  release:
    needs: [build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/StimolatoreClinico-macOS/*
            artifacts/StimolatoreClinico-Windows/*
            artifacts/StimolatoreClinico-Android/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
