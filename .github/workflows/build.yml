name: Build Desktop & Android

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target da buildare'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - windows
          - android

jobs:
  # ==========================================
  # macOS Build (DMG)
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate macOS icon from SVG
        run: |
          # Generate PNG from SVG at 1024x1024 for icns conversion
          sips -s format png build/icon.svg --out build/icon_1024.png --resampleWidth 1024 2>/dev/null || true
          # If sips can't handle SVG, use the existing icon.png
          if [ ! -f build/icon_1024.png ]; then
            cp build/icon.png build/icon_1024.png 2>/dev/null || true
          fi
          # Create iconset for macOS with all required sizes
          mkdir -p build/icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size build/icon_1024.png --out build/icon.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            if [ $double -le 1024 ]; then
              sips -z $double $double build/icon_1024.png --out build/icon.iconset/icon_${size}x${size}@2x.png
            fi
          done
          # Generate .icns file for electron-builder
          iconutil -c icns build/icon.iconset -o build/icon.icns 2>/dev/null || true

      - name: Build macOS DMG
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: StimolatoreClinico-macOS
          path: dist/*.dmg

  # ==========================================
  # Windows Build (EXE / NSIS Installer)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StimolatoreClinico-Windows
          path: dist/*.exe

  # ==========================================
  # Android Build (APK via Capacitor)
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp -r css www/
          cp -r js www/
          cp -r build www/

      - name: Initialize Capacitor Android
        run: npx cap add android

      - name: Generate Android adaptive icons with Monet support
        run: |
          # Generate legacy icons for backward compatibility
          for size_dpi in "48 mdpi" "72 hdpi" "96 xhdpi" "144 xxhdpi" "192 xxxhdpi"; do
            set -- $size_dpi
            convert build/icon.png -resize ${1}x${1} android/app/src/main/res/mipmap-${2}/ic_launcher.png
            cp android/app/src/main/res/mipmap-${2}/ic_launcher.png android/app/src/main/res/mipmap-${2}/ic_launcher_round.png
          done

          # Generate foreground layer PNGs for adaptive icon
          for size_dpi in "108 mdpi" "162 hdpi" "216 xhdpi" "324 xxhdpi" "432 xxxhdpi"; do
            set -- $size_dpi
            mkdir -p android/app/src/main/res/drawable-${2}
            convert build/icon-foreground.svg -resize ${1}x${1} -background none android/app/src/main/res/drawable-${2}/ic_launcher_foreground.png
          done

          # Generate monochrome layer PNGs for Material You / Monet theming
          for size_dpi in "108 mdpi" "162 hdpi" "216 xhdpi" "324 xxhdpi" "432 xxxhdpi"; do
            set -- $size_dpi
            convert build/icon-monochrome.svg -resize ${1}x${1} -background none android/app/src/main/res/drawable-${2}/ic_launcher_monochrome.png
          done

          # Create adaptive icon XML with monochrome layer
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
          </adaptive-icon>
          XMLEOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # Create background color resource
          mkdir -p android/app/src/main/res/values
          # Only add if not already present
          if ! grep -q "ic_launcher_background" android/app/src/main/res/values/colors.xml 2>/dev/null; then
            cat > android/app/src/main/res/values/ic_launcher_background.xml << 'XMLEOF'
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <color name="ic_launcher_background">#4F46E5</color>
            </resources>
          XMLEOF
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: StimolatoreClinico-Android
          path: android/app/build/outputs/apk/debug/*.apk

  # ==========================================
  # Create Release (on tag push)
  # ==========================================
  release:
    needs: [build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/StimolatoreClinico-macOS/*
            artifacts/StimolatoreClinico-Windows/*
            artifacts/StimolatoreClinico-Android/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
