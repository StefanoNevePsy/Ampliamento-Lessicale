name: Test Quaderno TICE

# Le regole di sicurezza del custode e i calcoli clinici vengono verificati a
# ogni modifica: una regola rotta deve fermarsi qui, non arrivare al centro.
on:
  push:
    branches: [claude/quaderno-tice]
    paths: ['custode/**', 'electron/**', 'js/tice-*.js', 'js/orario.js', 'js/numbers-reader.js', 'strumenti/**', 'sw.js', 'build.js', 'tools/test-*.js', 'tools/custode-mock.js']
  pull_request:
    paths: ['custode/**', 'electron/**', 'js/tice-*.js', 'js/orario.js', 'js/numbers-reader.js', 'strumenti/**', 'sw.js', 'build.js', 'tools/test-*.js', 'tools/custode-mock.js']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: File unico del custode aggiornato
        run: node tools/componi-custode.js --verifica
      - name: Logica del custode (permessi, idempotenza, conflitti, materiali)
        run: node tools/test-custode.js
      - name: Custode su Apps Script (servizi Google simulati)
        run: node tools/test-appsscript.js
      - name: Cifratura e fusione tra dispositivi
        run: node tools/test-tice-sync.js
      - name: Accesso Google dell'app desktop (Google finto)
        run: node tools/test-accesso-desktop.js
      - name: Pubblicazione con service worker
        run: node build.js && grep -q '"./index.html"' www/sw.js
      - name: Import dei quaderni Numbers e programma (quaderno sintetico)
        run: node tools/test-tice-import.js
      - name: Modalità dei quaderni
        run: node tools/test-tice-modalita.js
      - name: Griglie da stampare
        run: node tools/test-tice-stampa.js
      - name: Date e orari
        run: node tools/test-orario.js
      - name: Turni
        run: node tools/test-tice-turni.js
      - name: Task analysis nel programma
        run: node tools/test-tice-ta.js
      - name: Sintassi della presa dati
        run: for f in js/numbers-reader.js js/tice-*.js js/state.js js/patients.js js/dataviz.js js/gemini.js tice-config.js sw.js electron/*.js; do node --check "$f"; done
